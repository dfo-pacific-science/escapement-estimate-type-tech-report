name: Deploy PDF-first technical report site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::bookdown
            any::kableExtra
            github::pbs-assess/csasdown
          needs: bookdown

      - name: Install LibreOffice (PDF conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Render technical report DOCX
        run: |
          Rscript -e "csasdown::render()"

      - name: Convert DOCX to PDF
        run: |
          set -euo pipefail
          mkdir -p site
          libreoffice --headless --convert-to pdf --outdir site _book/techreport.docx

          PDF_PATH=$(ls -1 site/*.pdf | head -n 1)
          if [ -z "$PDF_PATH" ]; then
            echo "PDF conversion failed: no PDF found in site/." >&2
            exit 1
          fi

          if [ "$PDF_PATH" != "site/techreport.pdf" ]; then
            mv "$PDF_PATH" site/techreport.pdf
          fi

      - name: Build PDF landing page
        run: |
          cat > site/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Updated Escapement Estimate Type Classification Guidance</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 980px; line-height: 1.5; padding: 0 1rem; }
              .btn { display: inline-block; padding: 0.6rem 1rem; border-radius: 6px; text-decoration: none; margin-right: 0.5rem; }
              .btn-primary { background: #005ea5; color: #fff; }
              .muted { color: #666; }
              iframe { width: 100%; height: 78vh; border: 1px solid #ddd; border-radius: 6px; margin-top: 1rem; }
            </style>
          </head>
          <body>
            <h1>Updated Escapement Estimate Type Classification Guidance</h1>
            <p class="muted"><strong style="color:#b00020;">DRAFT</strong> — Primary artifact: CSAS-styled technical report PDF.</p>

            <p>
              <a class="btn btn-primary" href="./techreport.pdf">Download PDF</a>
            </p>

            <iframe src="./techreport.pdf" title="Technical report PDF preview"></iframe>
          </body>
          </html>
          HTML

      - name: Disable Jekyll
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
